<!DOCTYPE html>
<html>

        <title>Welcome to MakersBnB</title> 
        <link rel="stylesheet" href="static/style.css"> 
    </head>
    <body>
        <h1> Welcome to MakersBnB </h1>
        <h2> Listings </h2>
        <section>
            <ul>
                {% for listing in listings %}
                    <li><strong>{{ listing.title }}</strong> ({{ listing.description }}, <em>£{{ listing.price_per_night }}</em>)</li>
                {% endfor %}
            </ul>
    </section>
</html>
