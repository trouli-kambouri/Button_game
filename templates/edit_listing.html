<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit - {{ listing.title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/flash_styles.css">
</head>
<body class="edit-page-body">
    <div class="edit-form-container">
        <h1 class="form-title">Edit Listing</h1>
        <p class="form-subtitle">Converted bus stop with panoramic traffic views</p>

        <form action="/listings/{{ listing.id }}/edit" method="POST" enctype="multipart/form-data" class="styled-form">
            
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{ listing.title }}" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" required>{{ listing.description }}</textarea>
            </div>

            <div class="form-group">
                <label for="price">Price per Night (£)</label>
                <input type="number" id="price" name="price" value="{{ listing.price_per_night }}" required>
            </div>

            <div class="form-group-row">
                <div class="form-group col">
                    <label for="available_from">Available From</label>
                    <input type="date" id="available_from" name="available_from" value="{{ listing.available_from }}" required>
                </div>
                <div class="form-group col">
                    <label for="available_until">Available Until</label>
                    <input type="date" id="available_until" name="available_until" value="{{ listing.available_until }}" required>
                </div>
            </div>

            {% if gallery_images %}
                <div class="existing-images-section" style="margin-bottom: 25px;">
                    <label style="font-family: Georgia, serif; font-weight: bold; display: block; margin-bottom: 15px; text-align: center;">
                        Current Gallery Images
                    </label>
                    <div class="edit-image-grid" style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                        {% for img in gallery_images %}
                            <div class="edit-image-card" style="position: relative; width: 120px; height: 90px;">
                                <!-- The Gallery Image -->
                                <img src="{{ img.image_url }}" alt="Gallery image" style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.2);">
                                
                                
                                <a href="/listings/{{ listing.id }}/images/delete?image_url={{ img.image_url }}" 
                                   class="btn-delete-img" 
                                   title="Delete image" 
                                   style="position: absolute; top: -5px; right: -5px; background: #ff4d4d; color: white; text-decoration: none; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">
                                    ✕
                                </a>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            {% endif %}


            <div class="file-upload-zone">
                <div class="upload-icon">📷</div>
                <label class="upload-label">Add Photos from Your Device</label>
                <input type="file" name="additional_images" accept="image/*" multiple class="file-input">
                <p class="file-help">Select multiple photos (PNG, JPG, WEBP)</p>
            </div>


            <div class="form-actions">
                <button type="submit" class="btn-primary-action">Save Changes</button>
                <a href="/listings/{{ listing.id }}" class="btn-secondary-action">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
