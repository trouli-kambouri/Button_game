<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MakersBnB</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .listing {
            max-width: 700px;
            margin: auto;
        }

        .tagline {
            color: #555;
            margin-bottom: 30px;
        }

        .listing-images {
            display: flex;
            gap: 10px;
        }

        .listing-images img {
            width: 50%;
            height: 250px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <main class="listing">
        <header>
            <h1>MakersBnB</h1>

            <p class="tagline">
                Want a room? Call the owner. We’re just the middleman.
            </p>
        </header>

        <div class="listing-images">
            <img
                src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1000&q=80"
                alt="Living room of the listing"
            >

            <img
                src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1000&q=80"
                alt="Bedroom of the listing"
            >
        </div>

        <h2>Cosy London Apartment</h2>

        <p>
            A comfortable two-bedroom apartment located in South London.
            The listing includes a kitchen, living room and free Wi-Fi.
        </p>

        <h3>Contact the owner</h3>

        <p>
            Phone number:
            <a href="tel:07123456789">07123 456789</a>
        </p>
    </main>
</body>
</html>
