<!DOCTYPE html> 
<html> 
    <head> 
        <title>Listings</title> 
        <link rel="stylesheet" href="static/style.css"> 
    </head> 
    <body>
        {% include "navigation_bar.html" %} <!-- Adds navigation bar -->
        <h1> Listings </h1> <!-- Header -->
            <section class="listings-container">
                {% for (listing, email) in listings %}
                    <a href="/listings/{{ listing.id }}" class="listing-link">
                        <article class="listing-card">
                            <div class="image-container">
                                <img 
                                    src="/static/placeholder.png" 
                                    alt="{{ listing.title }}"
                                    class="listing-image"
                                >
                            </div>
                            <div class="listing-details">
                                <h3>{{ listing.title }}</h3>

                                <p>{{ listing.description }}</p>

                                <p class="price">
                                    £{{ listing.price_per_night }} per night
                                </p>

                                <p class="email">
                                    Contact: {{ email }}
                                </p>
                            </div>
                        </article>
                    </a>
            {% endfor %}
        </section>
    </body>
</html>
